---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: clusters.controller.kubeslice.io
spec:
  group: controller.kubeslice.io
  names:
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    singular: cluster
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Cluster is the Schema for the clusters API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClusterSpec defines the desired state of Cluster
            properties:
              clusterProperty:
                description: put in an object
                properties:
                  geoLocation:
                    description: GeoLocation contains information regarding Geographical
                      Location of the Cluster
                    properties:
                      cloudProvider:
                        description: CloudProvider is the cloud service provider
                        type: string
                      cloudRegion:
                        description: CloudRegion is the region of the cloud
                        type: string
                      latitude:
                        description: Latitude is the latitude of the cluster
                        type: string
                      longitude:
                        description: Longitude is the longitude of the cluster
                        type: string
                    type: object
                  monitoring:
                    description: Monitoring contains the Kubernetes Monitoring Dashboard
                    properties:
                      grafanaDashboardBaseURL:
                        description: GrafanaDashboardBaseURL is the base URL for the
                          grafana dashboard
                        type: string
                      kubernetesDashboard:
                        description: KubernetesDashboard contains the information
                          regarding Kubernetes Monitoring Dashboard
                        properties:
                          accessToken:
                            description: AccessToken is the Access Token to access
                              the KubernetesDashboard
                            type: string
                          enabled:
                            description: Enabled is the enable status of the KubernetesDashboard
                            type: boolean
                          endpoint:
                            description: Endpoint is the base endpoint to access the
                              kubernetes dashboard
                            type: string
                          ingressPrefix:
                            description: IngressPrefix is the prefix of ingress gateway
                              for KubernetesDashboard
                            type: string
                        type: object
                    type: object
                  telemetry:
                    description: Telemetry contains Telemetry information
                    properties:
                      enabled:
                        description: Enabled is the enable status of the Telemetry
                        type: boolean
                      endpoint:
                        description: Endpoint is the Telemetry Endpoint
                        type: string
                      telemetryProvider:
                        description: TelemetryProvider is the Telemetry Provider information
                        type: string
                    type: object
                type: object
              enableAutoEviction:
                type: boolean
              networkInterface:
                description: NetworkInterface is the network interface attached with
                  the cluster.
                type: string
              nodeIP:
                description: NodeIP is the IP address of the Node - deprecated field
                  use Plural NodeIPs
                type: string
              nodeIPs:
                items:
                  type: string
                type: array
              requeueOnFailure:
                type: boolean
            type: object
          status:
            description: ClusterStatus defines the observed state of Cluster
            properties:
              GPURestriction:
                properties:
                  enforceRestrictions:
                    description: EnforceRestrictions is the flag to check if the cluster
                      is restricted
                    type: boolean
                  lastUpdatedTimestamp:
                    description: LastUpdatedTimestamp is the timestamp when the enforcement
                      was updated
                    format: date-time
                    type: string
                type: object
              activeController:
                description: |-
                  ActiveController identifies the hub controller that currently holds leadership.
                  Populated only on an Active/Standby HA deployment; absent otherwise, so a
                  non-HA worker sees no behaviour change.
                properties:
                  activeIdentity:
                    description: ActiveIdentity is the HA identity of the hub that
                      wrote this field about itself
                    type: string
                  caBundle:
                    description: CABundle is the base64-encoded PEM CA bundle for
                      Endpoint
                    type: string
                  endpoint:
                    description: Endpoint is the API server endpoint of the hub currently
                      holding leadership
                    type: string
                  lastUpdated:
                    description: |-
                      LastUpdated is the timestamp when this declaration was last written. It gives
                      a consumer a deterministic tie-break if both hubs self-declare simultaneously.
                    format: date-time
                    type: string
                type: object
              clusterHealth:
                description: ClusterHealth shows the health of the worker cluster
                properties:
                  clusterHealthStatus:
                    description: ClusterHealthStatus shows the overall health status
                      of the cluster
                    enum:
                    - Normal
                    - Warning
                    type: string
                  componentStatuses:
                    description: ComponentStatuses shows the health status of individual
                      components in the cluster
                    items:
                      properties:
                        component:
                          description: Component name
                          type: string
                        componentHealthStatus:
                          enum:
                          - Normal
                          - Warning
                          - Error
                          type: string
                      required:
                      - component
                      - componentHealthStatus
                      type: object
                    type: array
                  lastUpdated:
                    description: LastUpdated is the timestamp when healthstatus was
                      updated
                    format: date-time
                    type: string
                type: object
              cniSubnet:
                description: CniSubnet is the podip and service ip subnet of CNI
                items:
                  type: string
                type: array
              conditions:
                description: |-
                  Conditions describe this worker's connection to its hub controller, e.g.
                  ControllerConnected and ControllerEndpointSynced. Written by the worker
                  operator about itself; absent on a worker that has never reported one.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              isDeregisterInProgress:
                description: IsDeregisterInProgress is the flag to check if the cluster
                  deregister is InProgress
                type: boolean
              namespaces:
                description: Namespaces present in cluster
                items:
                  properties:
                    name:
                      type: string
                    sliceName:
                      type: string
                  type: object
                type: array
              networkPresent:
                default: false
                description: NetworkPresent denotes if the networking components (NSM,
                  Spire) are installed on a cluster
                type: boolean
              nodeIPs:
                description: NodeIPs of the gateway node of worker cluster
                items:
                  type: string
                type: array
              registrationStatus:
                description: RegistrationStatus shows the status of cluster registration
                enum:
                - Pending
                - InProgress
                - Failed
                - Registered
                - DeregisterInProgress
                - DeregisterFailed
                - Deregistered
                type: string
              secretName:
                description: SecretName is the name of the secret for the worker cluster.
                type: string
              storageCapabilities:
                description: |-
                  StorageCapabilities contains auto-detected storage capabilities reported by the worker operator.
                  Populated only when the worker operator's storage-capability reconciler is active.
                properties:
                  defaultStorageClass:
                    description: |-
                      DefaultStorageClass is the name of the StorageClass annotated with
                      storageclass.kubernetes.io/is-default-class: "true" on the worker cluster
                    type: string
                  lastUpdated:
                    description: LastUpdated is the timestamp when capabilities were
                      last detected
                    format: date-time
                    type: string
                  rwxStorageClasses:
                    description: RWXStorageClasses lists all ReadWriteMany-capable
                      StorageClasses detected on the cluster
                    items:
                      description: RWXStorageClass describes a single ReadWriteMany-capable
                        StorageClass.
                      properties:
                        name:
                          description: Name is the StorageClass name (e.g. "rook-cephfs",
                            "juicefs-sc")
                          type: string
                        provisioner:
                          description: Provisioner is the CSI provisioner string (e.g.
                            "rook-ceph.cephfs.csi.ceph.com")
                          type: string
                      required:
                      - name
                      - provisioner
                      type: object
                    type: array
                type: object
              vCPURestriction:
                description: VCPURestriction is the restriction on the cluster disabling
                  the creation of new pods
                properties:
                  enforceRestrictions:
                    description: EnforceRestrictions is the flag to check if the cluster
                      is restricted
                    type: boolean
                  lastUpdatedTimestamp:
                    description: LastUpdatedTimestamp is the timestamp when the enforcement
                      was updated
                    format: date-time
                    type: string
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
